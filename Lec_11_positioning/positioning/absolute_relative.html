<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
            font-family:sans-serif;
        }
        h2{
            text-align:center;
        }
        .parent{
            margin:1rem;
            background-color: rgba(93, 27, 27, 0.2);
            width: 90vw;
            position: relative;

        }
        .box {
            width: 10rem;
            height: 10rem;
            margin-bottom: 1rem;
            border: dashed;
        }

        .box-1 {
            background-color: lightblue;
            position:relative;
        }

        .box-2 {
            background-color: rgb(240, 128, 128);
            position: absolute;
            top: 10px;
            left: 0;
        }
        .box-3 {
            background-color: rgb(240, 128, 128);
        }
        .box-4 {
            background-color: rgb(240, 128, 128);
            position: absolute;
            
        }
    </style>
</head>
<body>
   <h2>Absolute and Relative Positions</h2>
   
   <div class="parent"></div>
   <div class="box box-1">1</div>
        <div class="box box-2">2</div>
        <div class="box box-3">3</div>
        <div class="box box-4">4</div>

</body>
</html>
