<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Creator</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            color: #2c3e50;
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .input-area input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #addBtn {
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }

        #addBtn:hover {
            background-color: #2980b9;
        }

        .question-card {
            background: #f9f9f9;
            border-left: 4px solid #3498db;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 6px;
        }

        .question-card h3 {
            margin: 0 0 8px;
        }

        .question-card ul {
            margin: 0 0 8px;
            padding-left: 20px;
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .delete-btn:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <h1>📝 New Quiz Creator</h1>
    <div class="input-area">
        <input id="questionInput" type="text" placeholder="Enter question">
        <input id="optionA" type="text" placeholder="Option A">
        <input id="optionB" type="text" placeholder="Option B">
        <input id="optionC" type="text" placeholder="Option C">
        <input id="optionD" type="text" placeholder="Option D">
        <button id="addBtn">Add Question</button>
    </div>

    <div id="quizList"></div>

<!--  
    Requirements
    * when i click  -> 
        * we have to do validation
        * question gets added
        * input becones empty
    -->
<!-- 
1. when i click     
-->
<script>
    let questionInput=getElementById("questionInput");
    let optionA=document.getElementById("optionA");
    let optionB=document.getElementById("optionB");
    let optionC=document.getElementById("optionC");
    let optionD=document.getElementById("optionD");
    let addBtn = document.querySelector("#addBtn");

    let quizList=document.querySelector("#quizList");
    addBtn.addEventListener("click", function () {

        let questionValue=questionInput.value;
        let optionAvalue=optionA.value;
        let optionBvalue=optionB.value;
        let optionCvalue=optionC.value;
        let optionDvalue=optionD.value;

        let isNotempty=questionValue!=""&&optionAvalue!=""&&optionBvalue!=""&&optionCvalue!=""&&optionDvalue!="";
        if(isNotempty){
            // alert("ques");
            let questionCard=document.createElement("div");
            let innerElements=`<h3>${questionValue}<h3>
                <ul>
                     <li>${optionAvalue}</li>
                      <li>${optionAvalue}</li>
                       <li>${optionAvalue}</li>
                        <li>${optionAvalue}</li>
                        </ul>
                        <button class="delete-btn">delete</button>`;

                        questionCard.innerHTML=innerElements;
                        questionCard.className="question-card";
                        quizList.appendChild(questionCard);
        }
        else{
            alert("field empty ")
        }
   



        // we have to do add validation-> of non empty
// fetch the elements
// fetch there values
//values should not be empty



// alert("work in progress")

    })

    
</script>
</body>

</html>
