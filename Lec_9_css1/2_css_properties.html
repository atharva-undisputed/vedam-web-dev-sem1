<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Properties</title>
    <style>
        .first{
            color: red;
            font-size: 20px;
        }
        .hexa{
            color: #ff00ff;
            font-size: 20px;
        }
        .rgb{
            color: rgb(255, 0, 0);
            font-size: 20px;
        }
        .rgb-opacity{
            color: rgba(255, 0, 0, 0.5);
            font-size: 20px;
        }
        p{
            font-family: Arial, Helvetica, sans-serif;
            text-transform: capitalize;
        }
        .strike{
            text-decoration: line-through;
            text-align: right;
        }
    </style>
    <link rel="stylesheet" href="./external.css">
</head>
<body>
    <div>
<h2 class="first">First Heading</h2>
<h2 class="hexa">Second Heading</h2>
<h2 class="rgb">Third Heading</h2>
<h2 class="rgb-opacity">Fourth Heading</h2>

    </div>
    <h1>CSS Properties text and font</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ad, porro.</p>
    <p class="strike">This text has a line through it.</p>

    
</body>
</html>
