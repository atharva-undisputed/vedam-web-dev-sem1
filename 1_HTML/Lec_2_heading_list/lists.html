<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html lists</title>
</head>
<body>
    <h1>Unordered list</h1>
    <h2>Avenger Team</h2>
<ul>
    <li>Tony Stark </li>
    <li>Bruce Banner </li>
    <li>Peter Parker </li>
</ul>

<h1>Ordered list</h1>
<h2>Avenger Movie chronology</h2>
<ol>
    <li>Iron Man</li>
    <li>First Avenger</li>
    <li>Thor</li>
</ol> 
</body>
</html>
