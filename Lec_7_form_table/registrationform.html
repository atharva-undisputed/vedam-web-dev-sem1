<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

    <h1>
        REGISTRATION FORM
    </h1>
   <form>
    <div>
        <label for="first-name">First name:</label>
        <input type="text" id="first-name" placeholder="your first name">
       </div> 

       <div>
        <label for="last-name">Last name:</label>
        <input type="text" id="last-name" placeholder="your last name">

       </div> 

        <div>
<label for="campus" >campus:</label>
        <input type="text" readonly value="Sushant university">
        </div>

       <div>
        <label for="email">email:</label>
        <input type="email" id="email" placeholder="you@gmail.com">

       </div> 
      <div>
<label for="password">pass:</label>
        <input type="password" id="password" placeholder="*********">
      </div> 

      <div>
        <label for="gender">gender:</label>
        <select id="gender">
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div>
        <label for="mobile">Mobile:</label>
        <input type="tel" id="mobile" placeholder="10 digit mobile number" min="1000000000" max="9999999999">
      </div>


      <div>
        <label for="age">Age:</label>
        <input type="number" id="age" placeholder="your age" min="0" required>
      </div>



      <div>
        <label for="dob">DOB:</label>
        <input type="date" id="dob">
      </div>

      <div>
        <label for="profile">Profile picture:</label>
        <input type="file" id="profile" placeholder="your profile">
      </div>

      <div>
        <input type="submit" value="Submit"> <br>
        <button type="submit">register</button>
      </div>



   </form>
       

    
</body>
</html>
