<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        thead {
            background-color: lightgreen;
        }
    </style>
</head>
<body>

    <h2>time table</h2>
    <table>

        <thead>
            <tr>
                <th>day</th>
                <th>subject</th>
                <th>time</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>monday</td>
                <td>html</td>
                <td>10:00-11:00</td>
            </tr>
            <tr>
                <td>tuesday</td>
                <td>css</td>
                <td>11:00-12:00</td>
            </tr>
        <tr>
            <td>wednesday</td>
            <td>javascript</td>
            <td>12:00-1:00</td>
        </tr>
        <tr>
            <td>thursday</td>
            <td>python</td>
            <td>1:00-2:00</td>
        </tr>
        <tr>
            <td>friday</td>
            <td>java</td>
            <td>2:00-3:00</td>
        </tr>
        </tbody>
    </table>
    
</body>
</html>
